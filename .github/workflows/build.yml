name: Wails Build & MSI Installer

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      # --- Checkout ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- Go ---
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # --- Download embedded Python ---
      - name: Download CPython Embedded
        run: |
          curl -L -o python-embed.zip ^
            https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          mkdir python_embed
          tar -xf python-embed.zip -C python_embed

      # --- System Python for pip ---
      - name: Install Python for Pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- Install Python packages ---
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow onnxruntime onnxruntime-directml

          mkdir python_embed\site-packages
          xcopy /E /I /Y %LOCALAPPDATA%\Programs\Python\Python311\Lib\site-packages\* python_embed\site-packages\

      # --- Copy your Python module ---
      - name: Copy Python scripts
        run: |
          mkdir python_embed\Python
          xcopy /E /I /Y Python python_embed\Python\

      # --- Install Wails ---
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # --- Build app ---
      - name: Build Wails App
        run: wails build -platform windows/amd64 -o observer.exe

      # --- Prepare dist folder ---
      - name: Prepare Dist Folder
        run: |
          mkdir dist
          xcopy /E /I /Y build\bin dist\
          mkdir dist\Python
          xcopy /E /I /Y python_embed\* dist\Python\

      # --- Install WiX Toolset ---
      - name: Install WiX Toolset
        run: choco install wixtoolset --version=3.11.2 -y

      # --- Build MSI ---
      - name: Build MSI Installer
        run: |
          candle installer\Product.wxs -o installer\Product.wixobj
          light installer\Product.wixobj -o observer-setup.msi

      # --- Upload MSI artifact ---
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: observer-msi
          path: observer-light-setup.msi
