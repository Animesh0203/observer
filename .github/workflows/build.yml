name: Wails build

on:
  push:
    tags:
      - '*'

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnxruntime onnxruntime-directml numpy pillow

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build App
        run: wails build -platform windows/amd64 -o observer.exe

      # Copy Python folder next to the EXE
      - name: Add Python runtime to build output
        run: |
          mkdir build\bin\Python
          xcopy /E /I /Y Python build\bin\Python

      # Create a ZIP including exe + Python folder
      - name: Create ZIP archive
        run: |
          powershell Compress-Archive -Path build\bin\* -DestinationPath observer-windows.zip

      # Upload as artifact (optional)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: observer-windows
          path: observer-windows.zip

