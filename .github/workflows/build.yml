name: Wails Build & MSI Installer

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # --- Checkout ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- Go ---
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # --- Download Python for Development ---
      - name: Setup Python Development Environment
        run: |
          # Download full Python installer (includes headers and libs)
          curl -L -o python-installer.exe https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe
          Start-Process -FilePath "python-installer.exe" -ArgumentList "/quiet", "InstallAllUsers=0", "PrependPath=0", "TargetDir=$PWD\python_build" -Wait

          # Download embedded Python for distribution
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
          mkdir python_runtime
          tar -xf python-embed.zip -C python_runtime

      # --- System Python for pip (can remove this step now) ---
      - name: Install Python Dependencies
        run: |
          # Use the full Python installation
          .\python_build\python.exe -m pip install --upgrade pip
          .\python_build\python.exe -m pip install numpy pillow onnxruntime onnxruntime-directml

          # Copy site-packages to runtime Python
          $pysp = .\python_build\python.exe -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          echo "Python site-packages located at: $pysp"

          mkdir python_runtime\site-packages
          robocopy "$pysp" python_runtime\site-packages /E /NFL /NDL /NJH /NJS /NC /NS
          $robocopyExit = $LASTEXITCODE
          if ($robocopyExit -ge 8) { 
            echo "Robocopy failed with exit code $robocopyExit"
            exit 1 
          } else {
            echo "Robocopy completed successfully with exit code $robocopyExit"
            exit 0
          }

      # --- Copy your Python module ---
      - name: Copy Python scripts
        run: |
          xcopy /E /I /Y Python python_runtime\

      # --- Install Wails ---
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # --- Build app ---
      - name: Build Wails App
        run: |
          # Add Python to PATH so DLLs can be found during CGo compilation
          $env:PATH = "$PWD\python_build;$PWD\python_build\DLLs;$env:PATH"
          $env:CGO_ENABLED = "1"
          $env:CGO_CFLAGS = "-I$PWD\python_build\include"
          $env:CGO_LDFLAGS = "-L$PWD\python_build\libs -lpython311"

          wails build -platform windows/amd64 -o observer.exe

      # --- Prepare dist folder ---
      - name: Prepare Dist Folder
        run: |
          mkdir dist
          xcopy /E /I /Y build\bin dist\
          mkdir dist\Python
          xcopy /E /I /Y python_runtime\* dist\Python\

      # --- Install WiX Toolset ---
      - name: Install WiX Toolset
        run: choco install wixtoolset

      # --- Build MSI ---
      - name: Build MSI Installer
        run: |
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"

          # Harvest Python directory (suppress SelfReg warnings with -scom)
          heat dir dist\Python -cg PythonComponents -dr PYTHONDIR -gg -sfrag -srd -scom -var var.PythonSource -out installer\PythonFiles.wxs

          # Compile both files
          candle installer\Product.wxs installer\PythonFiles.wxs -dPythonSource=dist\Python -o installer\

          # Link with UI extension
          light installer\Product.wixobj installer\PythonFiles.wixobj -ext WixUIExtension -o observer-setup.msi -sval

      # --- Upload MSI artifact ---
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: observer-msi
          path: observer-setup.msi
